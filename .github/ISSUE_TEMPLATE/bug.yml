name: Bug
description: Something does not work as expected (not for security issues)
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
